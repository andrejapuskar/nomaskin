<style>
:root {
  --font-heading: 'Marcellus', serif;
  --font-body: 'Marcellus', serif;
  --color-bg: #2f3520;
  --color-text: #f1efe3;
  --color-muted: color-mix(in srgb, #f1efe3 82%, transparent);
  --color-divider: color-mix(in srgb, #f1efe3 22%, transparent);
  --color-accent: #d2ad6c;
  --color-accent-light: #e3c48f;
  --yellow: #e9c440;
  --yellow-hover: #ffe47a;
  --yellow-active: #c9a42a;
  --pad-x: 24px;
}
@media (max-width: 600px) { :root { --pad-x: 16px; } }
*, *::before, *::after { box-sizing: border-box; }
html { scroll-behavior: smooth; }
body { margin: 0; background: var(--color-bg); color: var(--color-text); font-family: var(--font-body); font-size: 15px; line-height: 1.55; text-wrap: pretty; overflow-x: clip; }
img { max-width: 100%; }
h1, h2, h3 { font-family: var(--font-heading); font-weight: 400; margin: 0; }
p { margin: 0; }
a { color: var(--color-accent-light); text-underline-offset: 3px; }
a:hover { color: var(--yellow-hover); }

.container { width: 100%; max-width: 1200px; margin-inline: auto; padding-inline: var(--pad-x); }
.section { padding-block: 112px; }
.rule { height: 1px; border: 0; margin: 0 auto; width: calc(100% - 2 * var(--pad-x)); max-width: calc(1200px - 2 * var(--pad-x)); background: var(--color-divider); }
.kicker { display: block; font-size: 13px; letter-spacing: 0.08em; text-transform: uppercase; color: var(--color-accent-light); margin-bottom: 20px; }
.h2 { font-size: clamp(34px, 4vw, 48px); line-height: 1.12; }
.prose { display: flex; flex-direction: column; gap: 20px; font-size: 17px; line-height: 28px; color: var(--color-muted); }
.grid-2 { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 380px), 1fr)); gap: 64px; align-items: center; }
.photo { display: block; width: 100%; height: auto; border-radius: 20px; object-fit: cover; }

.btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; cursor: pointer; text-decoration: none; font: inherit; font-size: 15px; line-height: 1.2; padding: 10px 18px; border-radius: 4px; white-space: nowrap; background: var(--yellow); color: var(--color-bg); border: 1px solid var(--yellow); transition: background .15s ease, border-color .15s ease, transform .15s ease; }
.btn:hover { background: var(--yellow-hover); border-color: var(--yellow-hover); color: var(--color-bg); transform: translateY(-2px); }
.btn:active { background: var(--yellow-active); border-color: var(--yellow-active); transform: none; }
.btn:focus-visible { outline: 2px solid var(--yellow-hover); outline-offset: 3px; }
.btn-lg { padding: 14px 28px; font-size: 16px; }
.btn-block { width: 100%; }
.btn-outline { background: transparent; color: var(--yellow); }
.btn-icon { width: 36px; height: 36px; padding: 0; }

.nav { position: sticky; top: 0; z-index: 10; background: var(--color-bg); border-bottom: 1px solid var(--color-divider); }
.nav .container { display: flex; align-items: center; gap: 16px; padding-block: 14px; }
.nav-brand { font-family: var(--font-heading); font-weight: 600; font-size: 18px; color: var(--color-text); text-decoration: none; margin-right: auto; }
.nav-brand:hover { color: var(--color-text); }

.hero { padding-block: 96px 112px; display: flex; flex-direction: column; gap: 48px; }
.hero h1 { font-size: clamp(44px, 7.6vw, 108px); line-height: 1.04; letter-spacing: -0.015em; }
.hero-lead { margin-top: 28px; max-width: 46ch; font-size: clamp(18px, 1.8vw, 21px); line-height: 1.5; color: color-mix(in srgb, var(--color-text) 85%, transparent); }
.hero-media { position: relative; border-radius: 20px; overflow: hidden; }
.hero-media img { display: block; width: 100%; height: auto; aspect-ratio: 1374 / 1145; object-fit: cover; }
.price-tag { position: absolute; display: flex; flex-direction: column; gap: 2px; padding: 10px 14px; background: var(--color-bg); border: 1px solid var(--color-divider); border-radius: 6px; text-decoration: none; color: var(--color-text); line-height: 1.2; }
.price-tag:hover { border-color: var(--color-accent); color: var(--color-text); }
.price-tag b { font-family: var(--font-heading); font-size: clamp(13px, 1.4vw, 17px); font-weight: 600; white-space: nowrap; }
.price-tag span { font-size: clamp(12px, 1.2vw, 15px); color: var(--color-accent-light); white-space: nowrap; }
.hero-foot { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 340px), 1fr)); gap: 32px 64px; align-items: end; padding-top: 40px; }
.hero-foot-lead { font-family: var(--font-heading); font-size: clamp(24px, 2.6vw, 32px); line-height: 1.25; letter-spacing: -0.01em; }
.hero-foot-side { display: flex; flex-direction: column; gap: 20px; border-left: 1px solid var(--color-divider); padding-left: 32px; }
.tnum { font-feature-settings: 'tnum' 1; }

.big-num { font-family: var(--font-heading); font-size: clamp(160px, 22vw, 300px); line-height: .85; color: var(--color-accent); }
.benefit { display: flex; gap: 16px; align-items: flex-start; padding: 20px 0; border-top: 1px solid var(--color-divider); font-size: 17px; line-height: 28px; }
.benefit svg { flex: none; margin-top: 4px; }

.review { margin: 0; border: 1px solid var(--color-divider); border-radius: 20px; padding: 36px 32px 28px; display: flex; flex-direction: column; gap: 22px; transition: border-color .2s ease, transform .2s ease; }
.review:hover { border-color: var(--yellow); transform: translateY(-4px); }
.review-top { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
.stars { display: flex; gap: 3px; color: var(--yellow); }
.pill { font-size: 12px; letter-spacing: .08em; text-transform: uppercase; padding: 5px 10px; border: 1px solid color-mix(in srgb, var(--yellow) 60%, transparent); border-radius: 999px; color: var(--yellow); white-space: nowrap; }
.review-hook { font-family: var(--font-heading); font-weight: 500; font-size: clamp(26px, 2.4vw, 30px); line-height: 1.2; letter-spacing: -0.01em; }
.review blockquote { margin: 0; font-size: 16px; line-height: 1.6; color: color-mix(in srgb, var(--color-text) 78%, transparent); }
.review figcaption { display: flex; align-items: center; gap: 12px; padding-top: 18px; border-top: 1px solid var(--color-divider); font-size: 16px; font-weight: 600; }
.avatar { width: 40px; height: 40px; flex: none; border-radius: 50%; background: var(--yellow); color: var(--color-bg); display: flex; align-items: center; justify-content: center; font-family: var(--font-heading); font-weight: 600; font-size: 18px; }

.card { display: flex; flex-direction: column; gap: 16px; padding: 20px; border: 1px solid var(--color-divider); border-radius: 4px; }
.card.is-selected { border-color: var(--color-accent); }
.card-img { width: 100%; aspect-ratio: 1 / 1; border-radius: 12px; object-fit: cover; display: block; }
.card h3 { font-weight: 500; font-size: 24px; line-height: 1.2; }

.cart-row { display: flex; align-items: center; gap: 12px; padding: 14px 0; border-bottom: 1px solid var(--color-divider); }
.field label { display: block; font-size: 13px; margin-bottom: 5px; color: color-mix(in srgb, var(--color-text) 70%, transparent); }
.input { width: 100%; min-height: 40px; padding: 8px 12px; font: inherit; font-size: 15px; color: var(--color-text); caret-color: var(--color-accent); background: transparent; border: 1px solid var(--color-divider); border-radius: 4px; }
.input::placeholder { color: color-mix(in srgb, #f1efe3 50%, transparent); }
.input:hover { border-color: color-mix(in srgb, var(--color-text) 45%, transparent); }
.input:focus-visible { border-color: var(--color-accent); outline: 2px solid var(--color-accent); outline-offset: 0; }

@keyframes nomaMarquee { from { transform: translateX(-50%); } to { transform: translateX(0); } }
    @keyframes nomaUp { from { opacity: 0; transform: translateY(0.35em); } to { opacity: 1; transform: none; } }
.w { display: inline-block; animation: nomaUp .7s cubic-bezier(.2,.7,.2,1) both; }
.js-hidden { opacity: 0; }
@media (prefers-reduced-motion: reduce) { *, .w { animation: none !important; } .js-hidden { opacity: 1 !important; } }
</style>
<style>
.pd { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 420px), 1fr)); gap: 56px 72px; align-items: start; padding-block: 64px 96px; }
.pd-media { position: sticky; top: 96px; }
.pd-media img { display: block; width: 100%; aspect-ratio: 1 / 1; object-fit: cover; border-radius: 20px; }
.pd-info { display: flex; flex-direction: column; gap: 28px; }
.pd-back { font-size: 14px; letter-spacing: .08em; text-transform: uppercase; text-decoration: none; }
.pd h1 { font-size: clamp(40px, 5vw, 64px); line-height: 1.05; }
.pd-rows { border-top: 1px solid var(--color-divider); }

.qty { display: flex; align-items: center; gap: 4px; border: 1px solid var(--color-divider); border-radius: 4px; padding: 4px; }

.ing { list-style: none; margin: 0; padding: 0; }
.ing li { display: flex; gap: 14px; align-items: baseline; padding: 12px 0; border-top: 1px solid var(--color-divider); font-size: 17px; line-height: 1.55; }
.ing li::before { content: ''; flex: none; width: 7px; height: 7px; border-radius: 50%; background: var(--yellow); transform: translateY(-2px); }
.ing b { font-weight: 400; color: var(--yellow); }
.other { display: flex; flex-direction: column; gap: 12px; text-decoration: none; color: var(--color-text); padding: 16px; border: 1px solid var(--color-divider); border-radius: 12px; transition: border-color .2s ease, transform .2s ease; }
.other:hover { border-color: var(--yellow); transform: translateY(-4px); color: var(--color-text); }
.other img { width: 100%; aspect-ratio: 1 / 1; object-fit: cover; border-radius: 8px; display: block; }
</style>
</head>

  }
  $('inc').onclick = function () { qty++; update(); };
  $('dec').onclick = function () { qty = Math.max(1, qty - 1); update(); };
  update();
  $('others').innerHTML = PRODUCTS.filter(function (x) { return x.id !== p.id; }).map(function (x) {
    return '<a class="other" href="proizvod.html?id=' + x.id + '"><img src="' + x.img + '" alt="' + x.name + '" loading="lazy"><span style="font-size: 18px; line-height: 1.25;">' + x.name + '</span><span class="tnum" style="font-size: 15px; color: var(--color-accent-light);">' + fmt(x.price) + '</span></a>';
  }).join('');
})();
</script>
</body>
